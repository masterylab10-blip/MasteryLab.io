<!DOCTYPE html>

<html lang="en">
<head>
<script src="/clean-urls.js?v=1"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | MasteryLab Portal</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Outfit:wght@300;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Favicon -->
<link href="/media/favicon.png" rel="icon" type="image/png"/>
<!-- Custom CSS -->
<link href="/style.css" rel="stylesheet"/>
<script src="/site-forms.js?v=20261013"></script>
<link rel="stylesheet" href="/site-ui.css?v=20261013">
<script src="/site-ui.js?v=20261013" defer></script>
<meta name="robots" content="noindex, follow">
<meta name="description" content="Login. Explore information and details from MasteryLab in Switzerland.">
</head>
<body>
<!-- Navigation -->
<nav class="navbar">
<div class="container">
<a class="logo" href="/"><img decoding="async" height="486" width="2683" class="logo-wordmark" src="/media/site-optimized/logo-wordmark-d19671-960.webp" alt="MasteryLab" fetchpriority="high" srcset="/media/site-optimized/logo-wordmark-d19671-480.webp 480w, /media/site-optimized/logo-wordmark-d19671-960.webp 960w, /media/site-optimized/logo-wordmark-d19671-1600.webp 1600w" sizes="(max-width: 767px) 90vw, 700px"></a>
<div class="nav-links">
</div>
</div>
</nav>
<main class="auth-page" style="display: flex; align-items: center; min-height: 100vh; padding-top: 0;">
<div class="container">
<div class="auth-form-container" style="margin-top: 0; margin-bottom: 0;">
<h2 class="text-center text-primary" style="margin-bottom: 2rem;">WELCOME BACK</h2>
<form action="#" method="POST">
<div class="form-group">
<label class="form-label">Email Address</label>
<input class="form-input" id="email" required="" type="email"/>
</div>
<div class="form-group">
<label class="form-label">Password</label>
<input class="form-input" id="password" required="" type="password"/>
</div>
<div class="form-group" style="text-align: right; margin-bottom: 2rem;">
<a href="#" style="font-size: 0.85rem; color: #aaa; text-decoration: none;">Forgot Password?</a>
</div>
<div class="form-group">
<button class="btn btn-primary" id="submitBtn" style="width: 100%; border-radius: 8px;" type="submit">Login</button>
</div>
</form>
<div class="auth-footer">
                    Don't have an account? <a href="/register/">Register here</a>
</div>
</div>
</div>
</main>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js?v=clean1"></script>
<script>
        const loginForm = document.querySelector('form');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI Loading State
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = "Logging in...";
            submitBtn.disabled = true;

            // Collect Data
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Call Supabase Helper
                const { data, error } = await window.loginUser(email, password);

                if (error) {
                    throw error;
                }

                // Redirect on success (e.g. to home or dashboard)
                window.location.href='/portal';

            } catch (err) {
                console.error("Login Error:", err);
                alert("Login Failed: " + err.message);
            } finally {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
